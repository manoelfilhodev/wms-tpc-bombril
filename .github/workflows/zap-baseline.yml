name: OWASP ZAP Baseline

on:
  push:
    branches:
      - main
      - security/**
      - feature/**
      - homolog/**
  workflow_dispatch:
    inputs:
      target_url:
        description: Homologation URL to scan
        required: true
        type: string

jobs:
  zap:
    runs-on: ubuntu-latest
    steps:
      - name: ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.14.0
        with:
          target: ${{ inputs.target_url || secrets.ZAP_TARGET_URL }}
          cmd_options: '-a -r zap-baseline-report.html'
          fail_action: false

      - name: Upload ZAP report
        uses: actions/upload-artifact@v4
        with:
          name: zap-baseline-report
          path: zap-baseline-report.html
